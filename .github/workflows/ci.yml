name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_gates:
        description: "Run sub-prod live verifier and deployed e2e gates"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  local-gates:
    name: local gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Copy sandbox wasm
        run: npm run copy-wasm

      - name: Typecheck host packages
        run: npm run typecheck

      - name: Run host test suite
        run: npm test -- --reporter=dot

      - name: Verify executor core sync
        run: npm run check:verifier-sync

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Install Fluent app dependencies
        run: npm ci
        working-directory: sn-executor-app/fluent

      - name: Build Fluent app
        run: npm run build
        working-directory: sn-executor-app/fluent

      - name: Audit Fluent toolchain
        run: npm audit --audit-level=high
        working-directory: sn-executor-app/fluent

      - name: Generate SBOM
        run: npm exec --no -- cyclonedx-npm --output-file sbom.json

      - name: Generate license report
        run: node scripts/license-report.mjs package-lock.json sn-executor-app/fluent/package-lock.json > license-report.json

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            sbom.json
            license-report.json

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  live-subprod-gates:
    name: live sub-prod gates
    runs-on: ubuntu-latest
    needs: [local-gates]
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_gates == 'true' && github.ref == 'refs/heads/main'
    environment: sub-prod
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix sn-executor-app/fluent

      - name: Build offline artifacts
        run: |
          npm run copy-wasm
          npm run typecheck
          npm run build --prefix sn-executor-app/fluent

      - name: Verify scoped executor on ServiceNow
        run: node scripts/executor-scoped-verify.mjs
        env:
          SNOW_INSTANCE_HOST: ${{ secrets.SNOW_INSTANCE_HOST }}
          SNOW_DEV_ROPC_USERNAME: ${{ secrets.SNOW_DEV_ROPC_USERNAME }}
          SNOW_DEV_ROPC_PASSWORD: ${{ secrets.SNOW_DEV_ROPC_PASSWORD }}
          X_MCP_EXECUTOR_HMAC_KEY: ${{ secrets.X_MCP_EXECUTOR_HMAC_KEY }}
          SNOW_EXECUTOR_PATH: ${{ secrets.SNOW_EXECUTOR_PATH }}

      - name: Run deployed MCP e2e
        run: npm run deploy:e2e
        env:
          WORKER_PUBLIC_ORIGIN: ${{ secrets.WORKER_PUBLIC_ORIGIN }}
          MCP_OPERATOR_SECRET: ${{ secrets.MCP_OPERATOR_SECRET }}
          MCP_OPERATOR_USER_ID: ${{ secrets.MCP_OPERATOR_USER_ID }}
