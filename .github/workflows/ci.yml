name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_gates:
        description: "Run sub-prod live scoped-executor verifier"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      run_production_oidc_e2e:
        description: "Run production OIDC deployed MCP e2e"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  local-gates:
    name: local gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sn-executor-app/fluent/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Copy sandbox wasm
        run: npm run copy-wasm

      - name: Typecheck host packages
        run: npm run typecheck

      - name: Run host test suite
        run: npm test -- --reporter=dot

      - name: Verify executor core sync
        run: npm run check:verifier-sync

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Install Fluent app dependencies
        run: npm ci
        working-directory: sn-executor-app/fluent

      - name: Build Fluent app
        run: npm run build
        working-directory: sn-executor-app/fluent

      - name: Audit Fluent toolchain
        run: npm audit --audit-level=high
        working-directory: sn-executor-app/fluent

      - name: Generate SBOM
        run: npm exec --no -- cyclonedx-npm --output-file sbom.json

      - name: Enforce license policy
        run: node scripts/license-report.mjs --policy license-policy.json --enforce package-lock.json sn-executor-app/fluent/package-lock.json > license-report.json

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain
          path: |
            sbom.json
            license-report.json

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  live-subprod-gates:
    name: live sub-prod scoped executor gate
    runs-on: ubuntu-latest
    needs: [local-gates]
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_gates == 'true' && github.ref == 'refs/heads/main'
    environment: sub-prod
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sn-executor-app/fluent/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix sn-executor-app/fluent

      - name: Build offline artifacts
        run: |
          npm run copy-wasm
          npm run typecheck
          npm run build --prefix sn-executor-app/fluent

      - name: Verify scoped executor on ServiceNow
        run: node scripts/executor-scoped-verify.mjs
        env:
          SNOW_INSTANCE_HOST: ${{ secrets.SNOW_INSTANCE_HOST }}
          SNOW_DEV_ROPC_USERNAME: ${{ secrets.SNOW_DEV_ROPC_USERNAME }}
          SNOW_DEV_ROPC_PASSWORD: ${{ secrets.SNOW_DEV_ROPC_PASSWORD }}
          X_MCP_EXECUTOR_HMAC_KEY: ${{ secrets.X_MCP_EXECUTOR_HMAC_KEY }}
          SNOW_EXECUTOR_PATH: ${{ secrets.SNOW_EXECUTOR_PATH }}
          SNOW_EXECUTOR_TEST_USERNAME: ${{ secrets.SNOW_EXECUTOR_TEST_USERNAME }}
          SNOW_EXECUTOR_TEST_PASSWORD: ${{ secrets.SNOW_EXECUTOR_TEST_PASSWORD }}

  production-oidc-deployed-e2e:
    name: production OIDC deployed MCP e2e
    runs-on: ubuntu-latest
    needs: [local-gates]
    if: github.event_name == 'workflow_dispatch' && inputs.run_production_oidc_e2e == 'true' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sn-executor-app/fluent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for deployed OIDC browser gate
        run: npx playwright install --with-deps chromium

      - name: Verify deployed production OIDC MCP flow
        run: npm run production:oidc:e2e
        env:
          DEPLOYMENT_PROFILE: production
          AUTH_MODE: oidc
          WORKER_PUBLIC_ORIGIN: ${{ secrets.OIDC_E2E_WORKER_PUBLIC_ORIGIN }}
          OIDC_E2E_USERNAME: ${{ secrets.OIDC_E2E_USERNAME }}
          OIDC_E2E_PASSWORD: ${{ secrets.OIDC_E2E_PASSWORD }}
          OIDC_E2E_SCOPES: ${{ vars.OIDC_E2E_SCOPES }}
          OIDC_E2E_USERNAME_SELECTORS: ${{ vars.OIDC_E2E_USERNAME_SELECTORS }}
          OIDC_E2E_PASSWORD_SELECTORS: ${{ vars.OIDC_E2E_PASSWORD_SELECTORS }}
          OIDC_E2E_CONTINUE_SELECTORS: ${{ vars.OIDC_E2E_CONTINUE_SELECTORS }}
          OIDC_E2E_EXPECT_REFRESH_WRITE_DENIED: ${{ vars.OIDC_E2E_EXPECT_REFRESH_WRITE_DENIED }}
